<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="termBgClaude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14100e"/>
      <stop offset="100%" stop-color="#1c1613"/>
    </linearGradient>
    <style>
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 13px; fill: #a8a29e; }
      .code-font { font-family: Consolas, 'Fira Code', Monaco, 'Courier New', monospace; font-size: 14px; }
      .prompt { fill: #f59e0b; font-weight: bold; }
      .cmd { fill: #f5f5f4; font-weight: 600; }
      .info { fill: #a8a29e; }
      .success { fill: #4ade80; font-weight: bold; }
      .warn { fill: #fbbf24; }
      .gold-highlight { fill: #f59e0b; font-weight: bold; }

      @keyframes typeCmd { 0%, 5% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes showL1 { 0%, 15% { opacity: 0; transform: translateY(4px); } 25%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL2 { 0%, 30% { opacity: 0; transform: translateY(4px); } 40%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL3 { 0%, 45% { opacity: 0; transform: translateY(4px); } 55%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL4 { 0%, 60% { opacity: 0; transform: translateY(4px); } 70%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes showL5 { 0%, 75% { opacity: 0; transform: translateY(4px); } 85%, 100% { opacity: 1; transform: translateY(0); } }
      @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      .anim-cmd { animation: typeCmd 9s infinite; }
      .anim-l1 { animation: showL1 9s infinite; }
      .anim-l2 { animation: showL2 9s infinite; }
      .anim-l3 { animation: showL3 9s infinite; }
      .anim-l4 { animation: showL4 9s infinite; }
      .anim-l5 { animation: showL5 9s infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="800" height="360" rx="14" fill="url(#termBgClaude)" stroke="#44352b" stroke-width="1.5"/>
  
  <!-- Title Bar -->
  <path d="M0,14 Q0,0 14,0 L786,0 Q800,0 800,14 L800,40 L0,40 Z" fill="#292019"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/>
  <circle cx="42" cy="20" r="6" fill="#eab308"/>
  <circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="400" y="24" text-anchor="middle" class="t-title">PowerShell - Claude Desktop UAC Auto-Elevation &amp; Hot Patch</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 80)" class="code-font">
    <!-- Command Line -->
    <text x="0" y="0">
      <tspan class="prompt">PS C:\&gt; </tspan>
      <tspan class="cmd anim-cmd">irm https://fastly.jsdelivr.net/gh/good9527/Claude-Desktop-Chinese@main/install.ps1 | iex</tspan>
      <tspan fill="#f59e0b" class="cursor">█</tspan>
    </text>

    <!-- Output Lines -->
    <g class="anim-l1" transform="translate(0, 38)">
      <text x="0" y="0" class="info">[*] 检测到 Claude 目标: <tspan fill="#f59e0b">Windows 商店版 (MSIX Package) 受保护目录</tspan></text>
    </g>

    <g class="anim-l2" transform="translate(0, 72)">
      <text x="0" y="0" class="warn">[!] 正在申请管理员权限...（系统已弹出 UAC 提权确认框，点击【是】全自动接管）</text>
    </g>

    <g class="anim-l3" transform="translate(0, 106)">
      <text x="0" y="0" class="success">[✔] 权限穿透成功 (TakeOwn + ICACLS 攻破 TrustedInstaller 锁)</text>
    </g>

    <g class="anim-l4" transform="translate(0, 140)">
      <text x="0" y="0" class="info">[✔] 22,319 词条安全增量合并完成 (最高权限计划任务已注册, 商店升级永不失效)</text>
    </g>

    <g class="anim-l5" transform="translate(0, 185)">
      <rect x="-6" y="-22" width="740" height="42" rx="8" fill="#292019" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="5" class="gold-highlight">[🎉 汉化安装成功！] <tspan fill="#f5f5f4">重新启动 Claude 桌面端，立即畅享 99.8% 纯正完整中文！</tspan></text>
    </g>
  </g>
</svg>
