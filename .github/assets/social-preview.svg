  <!-- Footer Info -->
  <g transform="translate(100, 540)">
    <text x="0" y="30" font-family="Consolas, Monaco, monospace" font-size="16" fill="#f59e0b">
      irm https://raw.githubusercontent.com/good9527/Claude-Desktop-Chinese/main/install.ps1 | iex
    </text>
    <text x="960" y="30" font-family="sans-serif" font-size="15" font-weight="600" fill="#78716c">
