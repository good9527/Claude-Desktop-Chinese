    <text x="280" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#4ade80">权限绝对穿透</text>
    <text x="280" y="52" font-family="sans-serif" font-size="13" fill="#d6d3d1">接管 TrustedInstaller 锁</text>

    <!-- Badge 3 -->
    <rect x="520" y="0" width="240" height="70" rx="14" fill="url(#cardGrad)" stroke="#44352b" stroke-width="1.5"/>
    <text x="540" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#fbbf24">20/20 全绿</text>
    <text x="540" y="52" font-family="sans-serif" font-size="13" fill="#d6d3d1">双引擎 MSIX / Win32 测试</text>

    <!-- Badge 4 -->
    <rect x="780" y="0" width="240" height="70" rx="14" fill="url(#cardGrad)" stroke="#44352b" stroke-width="1.5"/>
    <text x="800" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#f97316">双模极速自愈</text>
    <text x="800" y="52" font-family="sans-serif" font-size="13" fill="#d6d3d1">开机守卫 + 15分钟心跳</text>
