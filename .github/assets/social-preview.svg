    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#f59e0b">UAC 自动提权</text>
    <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#d6d3d1">弹窗一键确认，免手动CMD</text>

    <!-- Badge 2 -->
