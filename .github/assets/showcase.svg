<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141110"/>
      <stop offset="50%" stop-color="#1c1613"/>
      <stop offset="100%" stop-color="#0f0c0b"/>
    </linearGradient>
    <linearGradient id="claudeOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221d"/>
      <stop offset="100%" stop-color="#201a16"/>
    </linearGradient>
    <linearGradient id="artifactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1915"/>
      <stop offset="100%" stop-color="#17120f"/>
    </linearGradient>
    <linearGradient id="thinkingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#382b22"/>
      <stop offset="100%" stop-color="#2a201a"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .font-mono { font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace; }
  </style>

  <!-- Outer Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="150" r="180" fill="#d97706" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="550" r="220" fill="#f59e0b" opacity="0.06" filter="url(#glow)"/>

  <!-- Desktop App Window Container -->
  <g transform="translate(30, 25)" filter="url(#shadow)">
    <!-- App Window Frame -->
    <rect width="1140" height="700" rx="14" fill="#181310" stroke="#3d3129" stroke-width="1.5"/>

    <!-- ──────────────── Window Header Bar ──────────────── -->
    <rect width="1140" height="42" rx="14" fill="#1e1814"/>
    <rect y="28" width="1140" height="14" fill="#1e1814"/>
    <line x1="0" y1="42" x2="1140" y2="42" stroke="#2e251f" stroke-width="1"/>

    <!-- Window Controls (macOS / Windows Hybrid) -->
    <circle cx="24" cy="21" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b" opacity="0.85"/>
    <circle cx="64" cy="21" r="6" fill="#10b981" opacity="0.85"/>

    <!-- Window Title -->
    <g transform="translate(480, 26)">
      <path d="M0,-8 L0,4 M-6,-2 L6,-2 M-4,-6 L4,2 M-4,2 L4,-6" stroke="url(#claudeOrange)" stroke-width="2.2" stroke-linecap="round"/>
      <text x="14" y="0" class="font-ui" font-size="13" font-weight="600" fill="#e7e5e4">Claude Desktop · 中文汉化深度增强版</text>
    </g>

    <!-- Header Status Badge -->
    <g transform="translate(1000, 13)">
      <rect width="116" height="20" rx="10" fill="#143224" stroke="#059669" stroke-width="1"/>
      <circle cx="12" cy="10" r="3.5" fill="#10b981"/>
      <text x="22" y="14" class="font-ui" font-size="11" font-weight="600" fill="#34d399">10s 守护中 · 正常</text>
    </g>

    <!-- ──────────────── Main Body Split ──────────────── -->

    <!-- LEFT SIDEBAR (Width: 240) -->
    <g transform="translate(0, 42)">
      <rect width="240" height="658" fill="#17120f"/>
      <line x1="240" y1="0" x2="240" y2="658" stroke="#2e251f" stroke-width="1"/>

      <!-- New Chat Button -->
      <g transform="translate(16, 16)">
        <rect width="208" height="36" rx="8" fill="url(#bubbleGrad)" stroke="#45372d" stroke-width="1"/>
        <text x="24" y="23" class="font-ui" font-size="14" font-weight="600" fill="#f5f5f4">＋ 新建对话</text>
        <rect x="156" y="10" width="38" height="16" rx="4" fill="#2d231c"/>
        <text x="162" y="22" class="font-ui" font-size="10" fill="#a8a29e">Ctrl+K</text>
      </g>

      <!-- Model Switcher Selector -->
      <g transform="translate(16, 64)">
        <rect width="208" height="34" rx="8" fill="#241d18" stroke="#3b2e25" stroke-width="1"/>
        <!-- Star Icon -->
        <circle cx="20" cy="17" r="5" fill="#f59e0b"/>
        <text x="34" y="21" class="font-ui" font-size="12" font-weight="600" fill="#fbbf24">Claude 3.7 Sonnet</text>
        <text x="188" y="21" class="font-ui" font-size="11" fill="#78716c">▾</text>
      </g>

      <!-- Sidebar Section: Recent Conversations -->
      <text x="20" y="126" class="font-ui" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.5">最近对话</text>

      <!-- Active Chat Item -->
      <g transform="translate(12, 136)">
        <rect width="216" height="34" rx="6" fill="#2b211a" stroke="#d97706" stroke-width="1"/>
        <text x="12" y="21" class="font-ui" font-size="12" font-weight="500" fill="#fed7aa">💬 自动更新检测与极速自愈</text>
      </g>

      <!-- Inactive Chat Item 1 -->
      <g transform="translate(12, 174)">
        <rect width="216" height="32" rx="6" fill="transparent"/>
        <text x="12" y="20" class="font-ui" font-size="12" fill="#a8a29e">💬 win-automation 键鼠自动化</text>
      </g>

      <!-- Inactive Chat Item 2 -->
      <g transform="translate(12, 210)">
        <rect width="216" height="32" rx="6" fill="transparent"/>
        <text x="12" y="20" class="font-ui" font-size="12" fill="#a8a29e">💬 前端响应式设计微调</text>
      </g>

      <!-- Sidebar Section: Projects Knowledge Base -->
      <text x="20" y="268" class="font-ui" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.5">项目知识库</text>
      <g transform="translate(12, 278)">
        <rect width="216" height="30" rx="6" fill="transparent"/>
        <text x="12" y="19" class="font-ui" font-size="12" fill="#a8a29e">📁 开源汉化引擎核心架构</text>
      </g>

      <!-- Sidebar Section: MCP Tools -->
      <text x="20" y="336" class="font-ui" font-size="11" font-weight="700" fill="#78716c" letter-spacing="0.5">MCP 扩展生态</text>
      <g transform="translate(12, 346)">
        <rect width="216" height="42" rx="8" fill="#1e1814" stroke="#362a22" stroke-width="1"/>
        <circle cx="16" cy="21" r="4" fill="#10b981"/>
        <text x="28" y="18" class="font-ui" font-size="12" font-weight="600" fill="#e7e5e4">win-automation-mcp</text>
        <text x="28" y="32" class="font-ui" font-size="10" fill="#34d399">已连接 · 允许控制 Windows 桌面</text>
      </g>

      <!-- User Profile & Settings Footer -->
      <g transform="translate(0, 598)">
        <line x1="0" y1="0" x2="240" y2="0" stroke="#2e251f" stroke-width="1"/>
        <g transform="translate(16, 14)">
          <circle cx="16" cy="16" r="14" fill="#3b2d23"/>
          <text x="11" y="21" class="font-ui" font-size="12" font-weight="700" fill="#f59e0b">G</text>
          <text x="40" y="16" class="font-ui" font-size="13" font-weight="600" fill="#f5f5f4">good9527</text>
          <text x="40" y="29" class="font-ui" font-size="11" fill="#78716c">偏好设置 · 22,319 词条已生效</text>
        </g>
      </g>
    </g>

    <!-- CENTER CHAT AREA (Width: 500) -->
    <g transform="translate(240, 42)">
      <rect width="500" height="658" fill="#1b1512"/>
      <line x1="500" y1="0" x2="500" y2="658" stroke="#2e251f" stroke-width="1"/>

      <!-- User Prompt Card -->
      <g transform="translate(24, 28)">
        <rect width="452" height="68" rx="10" fill="#261e19" stroke="#3b2d24" stroke-width="1"/>
        <text x="16" y="24" class="font-ui" font-size="11" font-weight="700" fill="#a8a29e">用户提问</text>
        <text x="16" y="48" class="font-ui" font-size="14" font-weight="500" fill="#fafaf9">请为 Claude 桌面版实现 10 秒轻量级后台更新自动自愈机制。</text>
      </g>

      <!-- Claude Extended Thinking Pill -->
      <g transform="translate(24, 114)">
        <rect width="452" height="74" rx="10" fill="url(#thinkingGrad)" stroke="#4a392c" stroke-width="1"/>
        <!-- Thinking icon & title -->
        <g transform="translate(16, 18)">
          <!-- Brain / Thought waves icon -->
          <circle cx="8" cy="8" r="6" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
          <path d="M5,8 Q8,4 11,8" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
          <text x="22" y="12" class="font-ui" font-size="12" font-weight="700" fill="#fbbf24">已深度思考 (1.2 秒) · 思维链已展开</text>
          <text x="400" y="12" class="font-ui" font-size="11" fill="#a8a29e">收起 ▾</text>
        </g>
        <text x="16" y="44" class="font-ui" font-size="11" fill="#d6d3d1">1. 检测 WindowsApps 微软商店目录与 Win32 程序路径</text>
        <text x="16" y="60" class="font-ui" font-size="11" fill="#d6d3d1">2. 采用 LastWriteTimeUtc 与 Length 纳秒级元数据比较，耗时 &lt;10μs</text>
      </g>

      <!-- Claude Response Card -->
      <g transform="translate(24, 206)">
        <!-- Claude Avatar -->
        <g transform="translate(0, 0)">
          <rect width="24" height="24" rx="6" fill="#2d221a" stroke="#f59e0b" stroke-width="1"/>
          <path d="M12,4 L12,20 M4,12 L20,12 M6,6 L18,18 M6,18 L18,6" stroke="url(#claudeOrange)" stroke-width="1.8" stroke-linecap="round"/>
          <text x="32" y="17" class="font-ui" font-size="13" font-weight="700" fill="#f5f5f4">Claude</text>
          <text x="86" y="17" class="font-ui" font-size="11" fill="#78716c">刚刚</text>
        </g>

        <!-- Response Body -->
        <g transform="translate(0, 34)">
          <text x="0" y="18" class="font-ui" font-size="13.5" fill="#f5f5f4" line-height="24">已为你设计专属的四级永久自愈架构：</text>
          <text x="0" y="46" class="font-ui" font-size="13" fill="#e7e5e4">• <tspan font-weight="700" fill="#f59e0b">Tier 1</tspan>：突破 WindowsApps 商店目录 ACL 受限锁</text>
          <text x="0" y="72" class="font-ui" font-size="13" fill="#e7e5e4">• <tspan font-weight="700" fill="#f59e0b">Tier 2</tspan>：22,319 词条安全增量合并，保留官方新特性</text>
          <text x="0" y="98" class="font-ui" font-size="13" fill="#e7e5e4">• <tspan font-weight="700" fill="#f59e0b">Tier 3</tspan>：流式原子覆盖，彻底避开文件锁定冲突</text>
          <text x="0" y="124" class="font-ui" font-size="13" fill="#e7e5e4">• <tspan font-weight="700" fill="#34d399">Tier 4</tspan>：10秒高速轻量心跳巡检，官方更新瞬时接管！</text>

          <text x="0" y="160" class="font-ui" font-size="13.5" fill="#f5f5f4">右侧为你生成了优化的实时守护后台代码工件：</text>
        </g>
      </g>

      <!-- Bottom Chat Input Bar -->
      <g transform="translate(20, 584)">
        <rect width="460" height="54" rx="12" fill="#241c17" stroke="#3d2f25" stroke-width="1.5"/>
        <text x="18" y="32" class="font-ui" font-size="13" fill="#78716c">向 Claude 发送消息... (支持上传截图与文件)</text>
        <!-- Send button -->
        <g transform="translate(416, 12)">
          <circle cx="15" cy="15" r="15" fill="url(#claudeOrange)"/>
          <path d="M10,15 L18,15 M15,11 L19,15 L15,19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
      </g>
    </g>

    <!-- RIGHT ARTIFACTS PANEL (Width: 400) -->
    <g transform="translate(740, 42)">
      <rect width="400" height="658" fill="url(#artifactGrad)"/>

      <!-- Artifact Top Bar -->
      <g transform="translate(0, 0)">
        <rect width="400" height="46" fill="#1b1512"/>
        <line x1="0" y1="46" x2="400" y2="46" stroke="#2e251f" stroke-width="1"/>
        
        <g transform="translate(18, 16)">
          <rect width="18" height="18" rx="4" fill="#3b2b20"/>
          <text x="4" y="14" class="font-ui" font-size="11" font-weight="700" fill="#f59e0b">&lt;&gt;</text>
          <text x="26" y="14" class="font-ui" font-size="13" font-weight="700" fill="#fafaf9">工件 · watcher.ps1</text>
          <text x="156" y="14" class="font-ui" font-size="11" fill="#78716c">PowerShell 脚本</text>
        </g>

        <!-- Artifact Control Buttons -->
        <g transform="translate(310, 12)">
          <rect width="32" height="22" rx="4" fill="#292019" stroke="#3d3026" stroke-width="1"/>
          <text x="8" y="16" class="font-ui" font-size="11" fill="#d6d3d1">复制</text>
          <rect x="40" width="32" height="22" rx="4" fill="#292019" stroke="#3d3026" stroke-width="1"/>
          <text x="48" y="16" class="font-ui" font-size="11" fill="#d6d3d1">弹窗</text>
        </g>
      </g>

      <!-- Artifact Code Editor View -->
      <g transform="translate(16, 62)">
        <rect width="368" height="520" rx="8" fill="#130e0c" stroke="#2e231c" stroke-width="1"/>

        <!-- Code lines -->
        <g transform="translate(14, 24)" class="font-mono" font-size="11.5">
          <text y="0" fill="#78716c"># Claude Desktop 10秒极速自愈守护引擎</text>
          
          <text y="24" fill="#f43f5e">function </text><text x="64" y="24" fill="#38bdf8">Start-ClaudeWatcherService</text><text x="238" y="24" fill="#e7e5e4"> {</text>
          
          <text y="48" fill="#38bdf8">  $lastCheckedUtc </text><text x="120" y="48" fill="#f43f5e">=</text><text x="135" y="48" fill="#fbbf24"> [DateTime]::MinValue</text>
          <text y="70" fill="#38bdf8">  $lastTargetLength </text><text x="132" y="70" fill="#f43f5e">=</text><text x="146" y="70" fill="#f59e0b"> -1</text>

          <text y="104" fill="#78716c">  # 10s 高速轻量元数据轮询 (纳秒级比较, ~0% CPU)</text>
          <text y="126" fill="#f43f5e">  while </text><text x="48" y="126" fill="#e7e5e4">($true) {</text>
          <text y="148" fill="#38bdf8">    Start-Sleep </text><text x="86" y="148" fill="#a8a29e">-Seconds </text><text x="144" y="148" fill="#f59e0b">10</text>
          
          <text y="174" fill="#e7e5e4">    $item = </text><text x="60" y="174" fill="#38bdf8">Get-Item </text><text x="120" y="174" fill="#fbbf24">$currentI18n</text>
          <text y="196" fill="#f43f5e">    if </text><text x="24" y="196" fill="#e7e5e4">($item.LastWriteTimeUtc -ne $lastCheckedUtc) {</text>
          
          <text y="222" fill="#78716c">      # 发现官方后台静默升级，立即热修复！</text>
          <text y="244" fill="#38bdf8">      Write-Log </text><text x="76" y="244" fill="#34d399">"检测到官方更新，正在静默自愈..."</text>
          <text y="268" fill="#38bdf8">      Apply-ClaudePatch </text><text x="132" y="268" fill="#a8a29e">-targetFile </text><text x="210" y="268" fill="#fbbf24">$currentI18n</text>
          <text y="290" fill="#e7e5e4">    }</text>
          <text y="312" fill="#e7e5e4">  }</text>
          <text y="334" fill="#e7e5e4">}</text>
        </g>
      </g>

      <!-- Bottom Status Pill in Artifact -->
      <g transform="translate(16, 598)">
        <rect width="368" height="42" rx="8" fill="#1e1814" stroke="#3b2d23" stroke-width="1"/>
        <circle cx="18" cy="21" r="5" fill="#10b981"/>
        <text x="32" y="19" class="font-ui" font-size="11.5" font-weight="600" fill="#fafaf9">已完整通过 20 项端到端测试</text>
        <text x="32" y="32" class="font-ui" font-size="10" fill="#a8a29e">支持 Windows 商店版 (MSIX) / 官方安装包 / macOS</text>
      </g>
    </g>
  </g>
</svg>
